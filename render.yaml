# Render blueprint — one free web service. The database is Supabase, not Render.
#
# ## Why one service and not two
#
# Auth is httpOnly cookies set `sameSite: 'lax'`, so the browser sends them on
# same-site requests only. Two Render services would be `dashboard-x.onrender.com`
# and `api-x.onrender.com`, and `onrender.com` is on the Public Suffix List —
# making those different *sites*, not just different origins. Sign-in would look
# like it worked (the tokens come back in the body too) and every request after
# it would answer 401. So the API serves the built dashboard from its own origin;
# `serveDashboard` in `src/main.ts` has the full reasoning.
#
# ## Why there is no `databases:` block
#
# The database is Supabase. That is not only a preference — it is what makes the
# free tier workable, because **Render's free tier has no shell** (SSH is a paid
# feature). Accounts are created with `dist/cli/admin`, and with a Render
# database that would be unreachable: free Render Postgres is internal-only. A
# Supabase database is reachable from anywhere, so the CLI runs from a laptop
# with the same connection string this service uses.
#
# ## ⚠ Which Supabase connection string
#
# **The session-mode pooler, not the direct connection.**
#
#   postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
#
# Supabase's *direct* connection (`db.<ref>.supabase.co:5432`) is **IPv6-only**,
# and Render's outbound is IPv4 — it fails with ENOTFOUND or hangs, which reads
# like a wrong password rather than a wrong address family.
#
# Session mode (port **5432** on the `pooler` host) behaves like an ordinary
# Postgres connection: prepared statements work, and `prisma migrate deploy`
# works. **Transaction mode (port 6543) does not** — migrations fail against it
# with "prepared statement does not exist". Since `prisma.config.ts` and the
# runtime client both read `DATABASE_URL`, one session-mode string serves both
# and there is no second `directUrl` to keep in step.
#
# Put the Supabase project in a region near this service (Frankfurt/eu-central)
# — every query crosses that gap.
#
# ## What the free tier costs, and what to watch
#
# - **The service spins down after ~15 minutes idle**, and the next request pays
#   roughly 50 seconds of cold start. Tolerable for a pilot, painful at a till.
#   Moving to Starter ($7/mo) removes it, and also restores shell access.
# - **Rate-limit counters live in memory**, so every cold start resets them
#   (DECISIONS.md §15 item 0). Close to harmless on one instance; a blocker for
#   running two.
# - **Supabase free projects pause after ~a week of inactivity.** A shop using
#   it daily never hits this; a demo left alone over a holiday does.
# - **512MB of build RAM.** This build runs two `npm ci` and two builds. If it
#   starts failing on memory, that is the first thing to suspect.
#
# ## Before the first deploy
#
# 1. **The service name is the hostname**, so this deploys to `reho.onrender.com`.
#    Render service names are globally unique across `onrender.com`, so if
#    `reho` is already taken the create will fail and the name here needs a
#    suffix — decide that *before* the first deploy, because renaming later
#    changes a URL people have bookmarked.
# 2. Set the four `sync: false` variables in the Render dashboard. `APP_URL` and
#    `FRONTEND_URL` are the *same* URL here, because there is one origin; both
#    exist because the mobile app may later have its own.
# 3. **No mail provider is needed**, because `SELF_SERVE_SIGNUP` is `false`
#    below. Nothing on this instance can mint a verification code or a reset
#    token, so there is no secret for the log fallback to leak. Turning signup on
#    later means configuring `RESEND_API_KEY` and `MAIL_FROM` in the same change
#    — `env.ts` refuses to boot on signup-on with mail-off, because registering
#    would create accounts whose codes go nowhere.
# 4. **Do not set `OTP_OVERRIDE`** on an instance holding real data. It is a
#    master key into every account, and the tier does not change that.

services:
  - type: web
    name: reho
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    healthCheckPath: /api/v1/health

    # Both halves are built: the API into `dist/`, the dashboard into
    # `web/dist/`, which is where `serveDashboard` looks for it. `web` has its
    # own lockfile and its own dependency tree — it shares no code with the API.
    buildCommand: >-
      npm ci &&
      npx prisma generate &&
      npm run build &&
      npm ci --prefix web &&
      npm run build --prefix web

    # Migrations run on boot. `migrate deploy` is idempotent, so a restart or a
    # cold start is safe — which matters more on the free tier, where restarts
    # are routine rather than exceptional.
    startCommand: npm run db:deploy && npm run start:prod

    envVars:
      # No `engines` field in package.json, so the runtime is pinned here or
      # Render picks its own default and changes it without telling anyone.
      - key: NODE_VERSION
        value: 22.18.0

      - key: NODE_ENV
        value: production

      # The Supabase **session-mode pooler** string. See the warning above: the
      # direct connection is IPv6-only and will not resolve from here, and the
      # transaction pooler breaks `prisma migrate deploy`.
      - key: DATABASE_URL
        sync: false

      # The pool is capped in code, not with `?connection_limit=` on the URL —
      # that is a Prisma Rust-engine parameter and this client uses the `pg`
      # driver adapter, which ignores it. See `PrismaService`. Five is also the
      # right order of magnitude for a pooled Supabase free project.
      - key: DATABASE_POOL_MAX
        value: 5

      # Generated once and then held by Render. Rotating any of these signs
      # everybody out, which is the intended behaviour if one leaks.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_RESET_SECRET
        generateValue: true

      # Off unless asked for: Swagger is a complete map of the API. `env.ts`
      # already defaults it closed; this makes the intent visible here too.
      - key: SWAGGER_ENABLED
        value: false

      # One origin, so the dashboard is not a cross-origin caller and needs no
      # entry. This stays for the mobile app and anything else built later —
      # set it to that client's origin when there is one.
      - key: CORS_ORIGINS
        sync: false

      # The service's own https:// URL, known only after the first deploy.
      # Both are the same value while there is one origin.
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false

      # Anyone can create their own shop, at /sign-up, with a username and a
      # password. That path mints no verification code, so it needs no mail
      # provider — which is what makes this deployment possible at all.
      #
      # Set it to false to close an instance to new shops: a demonstration, or
      # one customer's private deployment.
      - key: SELF_SERVE_SIGNUP
        value: true

      # Deliberately absent: RESEND_API_KEY and MAIL_FROM.
      #
      # Without them the paths that *send* something close themselves and say
      # so — emailed registration, resending a code, and password reset answer
      # 503 `EMAIL_UNAVAILABLE`. Username sign-up is untouched. Adding both
      # turns those back on with no other change.
      #
      # ⚠ The consequence worth knowing: until they are set, **a shop owner who
      # forgets their password cannot recover it themselves.** The sign-up form
      # offers an optional email for exactly this reason — whoever fills it in
      # can self-reset the day a provider exists; whoever skipped it needs us.
      # Until then recovery is done from a laptop, not a Render shell (the free
      # tier has none), against the same Supabase URL:
      #
      #   DATABASE_URL="<the session-pooler string>" \
      #     node dist/cli/admin set-password --username adebayo
      #
      # Owners change their own password from the dashboard at
      # /settings/password, which is the ordinary path and needs no mail.
